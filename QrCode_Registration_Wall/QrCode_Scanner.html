<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Summit QR Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="../assets/jsQR.js"></script>
  <script src="SummitApi.js?v=4"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b021a;color:white;font-family:Poppins,sans-serif}
    #reader,#reader video{position:absolute!important;inset:0;width:100%!important;height:100%!important;object-fit:cover!important;border:0!important}
    .reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,88vh,680px);aspect-ratio:1;border:3px solid #b687ff;border-radius:24px;box-shadow:0 0 18px #7737d7,inset 0 0 18px #7737d7;pointer-events:none}
    .reticle:after{content:"";position:absolute;left:7%;right:7%;top:10%;height:2px;background:#5af8e6;box-shadow:0 0 12px #5af8e6;animation:sweep 2.6s ease-in-out infinite alternate}@keyframes sweep{to{top:90%}}
    .header,.status{position:absolute;left:50%;transform:translateX(-50%);z-index:4;background:rgba(13,4,37,.87);border:1px solid rgba(181,143,255,.38);box-shadow:0 12px 36px rgba(0,0,0,.4);backdrop-filter:blur(14px);text-align:center}
    .header{top:max(12px,env(safe-area-inset-top));border-radius:20px;padding:8px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;letter-spacing:.16em}
    .header img{display:block;height:clamp(66px,11vh,110px);width:auto;max-width:78vw;object-fit:contain}
    .status{bottom:max(24px,env(safe-area-inset-bottom));border-radius:18px;padding:18px 22px;width:calc(100% - 32px);max-width:520px;font-size:15px;line-height:1.5}
    .status.ok{border-color:#62dcbc}.status.error{border-color:#ff8da0}
  </style>
</head>
<body>
  <div id="reader"></div><div class="reticle"></div>
  <div class="header"><img src="../assets/africa_logo_v2.png" alt="Africa Rare Disease Summit"><span>QR SCANNER</span></div>
  <div class="status" id="status" role="status">Connecting to registration sheet…</div>
  <script>
    const statusEl = document.getElementById('status');
    let cursor = 0;
    let busy = false;
    let recentText = '';
    let recentAt = 0;
    let sheetReady = false;
    let scannerVideo = null;
    let scanTimer = null;
    let scanPass = 0;
    const scanCanvas = document.createElement('canvas');
    const scanContext = scanCanvas.getContext('2d', {willReadFrequently:true});

    function status(message, kind = '') {
      statusEl.textContent = message;
      statusEl.className = 'status ' + kind;
    }
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function onScan(raw) {
      if (busy || (raw === recentText && Date.now() - recentAt < 10000)) return;
      const guest = SummitApi.parseQr(raw);
      if (!guest) { status('This QR code has no valid name.', 'error'); return; }
      busy = true;
      const requestId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
      try {
        if (!sheetReady) {
          status('Connecting to the registration sheet…');
          cursor = (await SummitApi.events(0)).latestCursor;
          sheetReady = true;
        }
        status('Saving ' + guest.name + '…');
        await SummitApi.submit({...guest, requestId});
        const deadline = Date.now() + 25000;
        let resent = false;
        while (Date.now() < deadline) {
          await pause(1100);
          const batch = await SummitApi.events(cursor);
          cursor = batch.cursor;
          if (batch.events.some(event => event.requestId === requestId)) {
            recentText = raw;
            recentAt = Date.now();
            status('✓ ' + guest.name + ' is on the registration screen.', 'ok');
            await pause(2500);
            status('Ready for the next QR code.');
            return;
          }
          if (!resent && Date.now() > deadline - 16000) {
            resent = true;
            await SummitApi.submit({...guest, requestId});
          }
        }
        status('Could not confirm this scan. Check the sheet connection and scan again.', 'error');
      } catch (error) {
        sheetReady = false;
        status(error.message || 'Sheet connection failed.', 'error');
      } finally {
        busy = false;
      }
    }

    function decodeFrame() {
      const pixels = scanContext.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
      return jsQR(pixels.data, pixels.width, pixels.height, {inversionAttempts:'dontInvert'})?.data || null;
    }

    function scanFrame() {
      if (!scannerVideo) return;
      if (!busy && scannerVideo.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && scannerVideo.videoWidth) {
        const sourceWidth = scannerVideo.videoWidth;
        const sourceHeight = scannerVideo.videoHeight;
        const scale = Math.min(1, 960 / Math.max(sourceWidth, sourceHeight));
        scanCanvas.width = Math.round(sourceWidth * scale);
        scanCanvas.height = Math.round(sourceHeight * scale);
        scanContext.drawImage(scannerVideo, 0, 0, scanCanvas.width, scanCanvas.height);
        let decoded = decodeFrame();
        if (!decoded) {
          // Reframe tightly cropped printed codes with a digital white margin.
          const fraction = scanPass++ % 2 === 0 ? 1 : 0.72;
          const side = Math.min(sourceWidth, sourceHeight) * fraction;
          const inset = 48;
          const contentSize = 640;
          scanCanvas.width = contentSize + inset * 2;
          scanCanvas.height = contentSize + inset * 2;
          scanContext.fillStyle = '#fff';
          scanContext.fillRect(0, 0, scanCanvas.width, scanCanvas.height);
          scanContext.drawImage(scannerVideo,
            (sourceWidth - side) / 2, (sourceHeight - side) / 2, side, side,
            inset, inset, contentSize, contentSize);
          decoded = decodeFrame();
        }
        if (decoded) onScan(decoded);
      }
      scanTimer = setTimeout(scanFrame, 300);
    }

    async function start() {
      if (!SummitApi.configured()) {
        status('Set the Apps Script /exec URL in SummitApi.js first.', 'error');
        return;
      }
      try {
        if (!window.jsQR) throw new Error('QR decoder did not load. Reload the page.');
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera access requires HTTPS or localhost.');
        const sheetConnection = SummitApi.events(0).then(batch => {
          cursor = batch.latestCursor;
          sheetReady = true;
          status('Ready — show the full QR with a little white badge area around it.');
        }).catch(error => {
          status('Camera ready, but sheet connection failed: ' + (error.message || error), 'error');
        });
        const stream = await navigator.mediaDevices.getUserMedia({
          audio:false,
          video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
        });
        scannerVideo = document.createElement('video');
        scannerVideo.autoplay = true;
        scannerVideo.muted = true;
        scannerVideo.playsInline = true;
        scannerVideo.srcObject = stream;
        document.getElementById('reader').replaceChildren(scannerVideo);
        await scannerVideo.play();
        scanFrame();
        await sheetConnection;
      } catch (error) {
        status('Camera unavailable: ' + (error.message || error), 'error');
      }
    }
    start();
  </script>
</body>
</html>
