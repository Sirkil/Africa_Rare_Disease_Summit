<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Africa Rare Diseases Summit - QR Code Scanner</title>
    <!-- Google Font Fallback (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* --- SANOFI BRAND FONT DECLARATION --- */
        @font-face {
            font-family: 'Sanofi';
            src: local('Sanofi'), local('Sanofi Sans'), local('Sanofi-Regular');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Sanofi';
            src: local('Sanofi Bold'), local('Sanofi-Bold');
            font-weight: 700;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b021a;
            font-family: 'Sanofi', 'Sanofi Sans', 'Poppins', sans-serif;
            color: white;
            position: relative;
        }

        /* Full Screen Reader Container */
        #reader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            z-index: 1;
            overflow: hidden;
            background: #0b021a;
        }

        #reader video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Reticle Viewfinder Overlay */
        .reticle-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 75vw;
            max-width: 480px;
            max-height: 480px;
            z-index: 5;
            pointer-events: none;
            box-shadow: 0 0 0 4000px rgba(11, 2, 26, 0.65);
            border-radius: 28px;
        }

        .reticle-corner {
            position: absolute;
            width: 42px;
            height: 42px;
            border-color: #9c27b0;
            border-style: solid;
            border-width: 0;
            filter: drop-shadow(0 0 8px #00e5ff);
        }

        .top-left {
            top: -2px;
            left: -2px;
            border-top-width: 5px;
            border-left-width: 5px;
            border-top-left-radius: 28px;
        }

        .top-right {
            top: -2px;
            right: -2px;
            border-top-width: 5px;
            border-right-width: 5px;
            border-top-right-radius: 28px;
        }

        .bottom-left {
            bottom: -2px;
            left: -2px;
            border-bottom-width: 5px;
            border-left-width: 5px;
            border-bottom-left-radius: 28px;
        }

        .bottom-right {
            bottom: -2px;
            right: -2px;
            border-bottom-width: 5px;
            border-right-width: 5px;
            border-bottom-right-radius: 28px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 2%;
            width: 96%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00e5ff, #9c27b0, transparent);
            box-shadow: 0 0 15px #00e5ff;
            animation: scanAnim 2.5s infinite ease-in-out;
            border-radius: 3px;
        }

        @keyframes scanAnim {
            0% { top: 2%; opacity: 0.8; }
            50% { top: 96%; opacity: 1; }
            100% { top: 2%; opacity: 0.8; }
        }

        /* Floating Header Bar */
        .scanner-header {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(18, 5, 38, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .scanner-header img {
            height: 22px;
            width: auto;
        }

        .scanner-header .dot {
            width: 9px;
            height: 9px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Floating Status Log at Bottom */
        .log {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: calc(100% - 40px);
            max-width: 500px;
            background: rgba(26, 7, 54, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: white;
            border-radius: 20px;
            padding: 18px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            font-weight: 500;
            font-size: 15px;
            line-height: 1.4;
            transition: all 0.3s ease;
            border: 1px solid rgba(156, 39, 176, 0.3);
        }

        .log.cooldown {
            background: rgba(46, 125, 50, 0.95);
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 12px 35px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>

<body>

    <!-- Floating Top Header Bar -->
    <div class="scanner-header">
        <img src="../assets/logo.png" alt="Summit Logo">
        <span class="dot" id="indicator-dot"></span>
        <span id="header-text">Scan Member QR Code</span>
    </div>

    <!-- Center Reticle Frame -->
    <div class="reticle-container">
        <div class="reticle-corner top-left"></div>
        <div class="reticle-corner top-right"></div>
        <div class="reticle-corner bottom-left"></div>
        <div class="reticle-corner bottom-right"></div>
        <div class="scan-line"></div>
    </div>

    <!-- Camera Reader container -->
    <div id="reader"></div>

    <!-- Status Log Overlay -->
    <div class="log" id="status-log">Camera initializing...</div>

    <script>
        let lastScannedPayload = "";
        let isCooldown = false;
        let countdownTimer = null;
        const statusLog = document.getElementById('status-log');
        const indicatorDot = document.getElementById('indicator-dot');
        const headerText = document.getElementById('header-text');
        
        // Setup BroadcastChannels
        const bc = window.BroadcastChannel ? new BroadcastChannel('africa_summit_registration') : null;
        const legacyBc = window.BroadcastChannel ? new BroadcastChannel('talabat_registration') : null;

        // Parse QR Code payload into name, country, and countryCode
        function parseQrPayload(rawText) {
            let name = "";
            let country = "";
            let code = "";

            if (!rawText) return { name: "", country: "", code: "" };

            const trimmed = rawText.trim();

            // 1. URL key-value params (e.g. name=Dr.+Amina+Khaled&country=Egypt)
            if (trimmed.includes('name=') || trimmed.includes('country=') || trimmed.includes('&') || trimmed.includes('?')) {
                try {
                    let q = trimmed;
                    if (q.includes('?')) q = q.split('?')[1];
                    const params = new URLSearchParams(q);
                    name = params.get('name') || params.get('memberName') || params.get('guestName') || "";
                    country = params.get('country') || params.get('memberCountry') || "";
                    code = params.get('code') || params.get('countryCode') || params.get('iso') || "";
                    if (name) return { name, country, code };
                } catch(e) {}
            }

            // 2. Try parsing JSON
            try {
                const data = JSON.parse(trimmed);
                name = data.name || data.memberName || data.guestName || "";
                country = data.country || data.memberCountry || "";
                code = data.code || data.countryCode || "";
                if (name) return { name, country, code };
            } catch(e) {}

            // 3. Try parsing Pipe delimiter e.g. "Dr. Amina Khaled | Egypt"
            if (trimmed.includes('|')) {
                const parts = trimmed.split('|');
                name = parts[0].trim();
                country = parts[1].trim();
                return { name, country, code };
            }

            // 4. Try parsing Comma delimiter e.g. "Dr. Amina Khaled, Egypt"
            if (trimmed.includes(',')) {
                const parts = trimmed.split(',');
                name = parts[0].trim();
                country = parts[1].trim();
                return { name, country, code };
            }

            // 5. Fallback: plain string as name
            return { name: trimmed, country: "", code: "" };
        }

        function onScanSuccess(decodedText, decodedResult) {
            console.log("Scanned QR Raw Text:", decodedText);
            if (isCooldown) return;
            if (decodedText === lastScannedPayload) return;

            isCooldown = true;
            lastScannedPayload = decodedText;
            statusLog.classList.add('cooldown');

            // Parse guest data
            const memberInfo = parseQrPayload(decodedText);
            const guestData = {
                name: memberInfo.name,
                country: memberInfo.country,
                code: memberInfo.code,
                raw: decodedText,
                timestamp: Date.now()
            };

            // Update UI indicators
            indicatorDot.style.backgroundColor = "#9c27b0";
            indicatorDot.style.boxShadow = "0 0 10px #9c27b0";
            headerText.innerText = "Processing...";

            // 1. Broadcast to Registration Display Screen via LocalStorage & BroadcastChannel
            localStorage.setItem('latestGuest', JSON.stringify(guestData));

            try {
                let existing = JSON.parse(localStorage.getItem('allGuests') || '[]');
                existing.push(guestData);
                localStorage.setItem('allGuests', JSON.stringify(existing));
            } catch (e) { }

            if (bc) bc.postMessage(guestData);
            if (legacyBc) legacyBc.postMessage(guestData);

            // 2. Countdown timer before resetting scanner lock
            let secondsLeft = 5;
            updateStatusText(memberInfo, secondsLeft);

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    updateStatusText(memberInfo, secondsLeft);
                } else {
                    clearInterval(countdownTimer);
                    restartScanner();
                }
            }, 1000);
        }

        function updateStatusText(memberInfo, seconds) {
            const displayName = memberInfo.name || "Member";
            const displayCountry = memberInfo.country ? ` (${memberInfo.country})` : "";
            statusLog.innerHTML = `✅ <strong>Scanned: ${displayName}${displayCountry}</strong><br><span style="font-size: 13px; opacity: 0.9;">Ready for next scan in ${seconds}s...</span>`;
        }

        function restartScanner() {
            statusLog.classList.remove('cooldown');
            statusLog.innerText = "Waiting for scan...";
            indicatorDot.style.backgroundColor = "#22c55e";
            indicatorDot.style.boxShadow = "0 0 10px #22c55e";
            headerText.innerText = "Scan Member QR Code";
            isCooldown = false;
            lastScannedPayload = "";
        }

        function onScanFailure(error) {
            // Quiet frame scan retry
        }

        function playSuccessBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) { }
        }

        // Initialize Camera
        const html5QrCode = new Html5Qrcode("reader");

        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 20,
                useBarCodeDetectorIfSupported: true,
                videoConstraints: {
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    advanced: [{ focusMode: "continuous" }]
                }
            },
            (decodedText, decodedResult) => {
                playSuccessBeep();
                onScanSuccess(decodedText, decodedResult);
            },
            onScanFailure
        ).then(() => {
            statusLog.innerText = "Waiting for scan...";
        }).catch((err) => {
            console.error("Camera access error:", err);
            statusLog.innerText = "Camera access denied or unavailable.";
        });
    </script>
</body>

</html>
